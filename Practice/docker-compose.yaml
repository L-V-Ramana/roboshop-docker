networks:
  default:
    driver: bridge
    name: roboshop
    # external: true #if if already created network manally then use as true


services:

  mongodb:
    image: ramslella/mongodb:v2
    container_name: mongodb

  catalogue:
    image: ramslella/catalogue:v2
    container_name: catalogue
    depends_on:
    - mongodb

  
  
  redis:
    image: redis:7.0
    container_name: redis
 
  user:
    image: ramslella/user:v2
    container_name: user
    depends_on:
    - mongodb
    - redis
  cart:
    image: ramslella/cart:v2
    container_name: cart
    depends_on:
    - redis
    - catalogue
    
  mysql:
    image: ramslella/mysql:v2
    container_name: mysql
  
  shipping:
    image: ramslella/shipping:v2
    container_name: shipping
    depends_on:
    - cart
    - mysql

  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
  
  payment:
    image: ramslella/payment:v2
    container_name: payment
    depends_on: 
    - cart
    - user
    - rabbitmq
 
  frontend:
    image: ramslella/frontend:v2
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment


  