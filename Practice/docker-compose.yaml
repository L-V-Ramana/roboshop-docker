networks:
  default:
    driver: bridge
    name: roboshop
    # external: true #if if already created network manally then use as true
volumes:
  rabbitmq:
  mysql:
  mongodb:
  redis:
services:
 
  mongodb:
    image: ramslella/mongodb:v2
    container_name: mongodb
    volumes:
    - mongodb:/data/db

  catalogue:
    image: ramslella/catalogue:v2
    container_name: catalogue
    # environment:
    # - MONGO=true
    # - MONGO_URL="mongodb://mongodb:27017/catalogue"
    depends_on:
    - mongodb
  
  redis:
    image: redis:7.0
    container_name: redis
    volumes:
    - redis:/data
 
  user:
    image: ramslella/user:v2
    container_name: user
    depends_on:
    - mongodb
    - redis
  cart:
    image: ramslella/cart:v2
    container_name: cart
    depends_on:
    - redis
    - catalogue
    
  mysql:
    image: ramslella/mysql:v2
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql

  # mysql:
  #   image: joindevops/mysql:v1
  #   container_name: mysql
  
  # shipping:
  #   image: ramslella/shipping:v2
  #   container_name: shipping
  #   depends_on:
  #   - cart
  #   - mysql

  shipping:
    image: ramslella/shipping:v2
    container_name: shipping
    depends_on:
    - cart
    - mysql
    environment:
    - DB_DRIVER=com.mysql.cj.jdbc.Driver
    - DB_URL=jdbc:mysql://mysql:3306/shipping?allowPublicKeyRetrieval=true&useSSL=false
    - DB_USER=root
    - DB_PASS=@RoboShop1


  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
    - rabbitmq:/var/lib/rabbitmq

  
  payment:
    image: ramslella/payment:v2
    container_name: payment
    depends_on: 
    - cart
    - user
    - rabbitmq
 
  frontend:
    image: ramslella/frontend:v2
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment


  